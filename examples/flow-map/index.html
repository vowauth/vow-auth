<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Карта путей Vow Auth</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<strong>Карта путей Vow Auth</strong>
				<span id="stamp" class="muted"></span>
			</div>
			<input id="search" class="search" type="search" placeholder="Найти функцию, файл, код ошибки…" aria-label="Поиск по узлам" />
			<label class="root">
				<span class="muted">Корень репозитория для ссылок в редактор</span>
				<input id="root" type="text" spellcheck="false" placeholder="C:/Git/vow-auth" />
			</label>
		</header>
		<div class="layout">
			<nav id="nav" class="nav" aria-label="Пути"></nav>
			<main class="stage">
				<div class="stage-head">
					<div>
						<h1 id="flow-title">Загрузка…</h1>
						<p id="flow-summary" class="muted"></p>
					</div>
					<div class="tools">
						<button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
						<button type="button" id="zoom-fit">По ширине</button>
						<button type="button" id="zoom-in" aria-label="Увеличить">+</button>
					</div>
				</div>
				<section id="legend" class="legend" aria-label="Обозначения"></section>
				<div id="canvas" class="canvas"></div>
				<section id="paths" class="paths"></section>
			</main>
			<aside id="details" class="details" aria-live="polite"></aside>
		</div>
		<script src="flow-data.js"></script>
		<script src="app.js"></script>
	</body>
</html>
